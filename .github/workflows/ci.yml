name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
      - name: Type check (warning gate)
        run: mypy config utils src run_pipeline.py || true
      - name: Test
        run: pytest
      - name: Smoke
        run: python run_pipeline.py --fast --stage all
