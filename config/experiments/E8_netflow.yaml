id: E8_netflow
description: NetFlow-v2 (binary) — per-dataset stages + E8 cross-dataset transfer (stage 8 pairs nf-cse/nf-unsw)
dataset: nf-cse-cic-ids2018-v2
label_schema: binary
split: random
subsample:
  rare_floor: 5000
  class_cap: 60000
model:
  hidden_layers: 4
  hidden_width: 128
  dropout: 0.2
training:
  scheme: split_sequential
  clients: 4
  dirichlet_alpha: 1.0
sweep:
  cut_depth: [1, 2, 3]
seeds: [0, 1, 2]
attacks: [random_matched, fgsm_pgd, gan_attack, activation_inference, client_attribution]
