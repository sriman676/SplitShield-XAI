# PRE-REGISTERED H2c (docs/PREREG_H2c.md). Same design as H2b_E4_cut_depth; only id, seeds and drift_instances (16 -> 128) differ.
id: H2c_E4_cut_depth
description: 'PRE-REGISTERED H2c (docs/PREREG_H2c.md, committed before any run): H2 on the corrected pipeline, NEW seeds 10-14, 128 stage-6 instances per seed (power analysis). Attack stages 4/6/7.'
dataset: cicids2017-improved
label_schema: family9
split: random
subsample:
  rare_floor: 5000
  class_cap: 60000
model:
  hidden_layers: 4
  hidden_width: 128
  dropout: 0.2
training:
  scheme: split_sequential
  clients: 4
  dirichlet_alpha: 1.0
  drift_instances: 128
sweep:
  cut_depth:
  - 1
  - 2
  - 3
seeds:
- 10
- 11
- 12
- 13
- 14
attacks:
- activation_inference
corrections:
- derived_v2
- attribution_converge
followup_of: E4_cut_depth
