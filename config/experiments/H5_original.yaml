id: H5_original
description: Original CIC-IDS2017 (H5 control, deliberately the defective one) — full stages
dataset: cicids2017-original
label_schema: family9
split: random
subsample:
  rare_floor: 5000
  class_cap: 60000
model:
  hidden_layers: 4
  hidden_width: 128
  dropout: 0.2
training:
  scheme: split_sequential
  clients: 4
  dirichlet_alpha: 1.0
sweep:
  cut_depth: [1, 2, 3]
seeds: [0, 1, 2]
attacks: [random_matched, fgsm_pgd, gan_attack, activation_inference, client_attribution]
