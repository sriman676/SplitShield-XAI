id: E4_cut_depth
description: Cut-depth ablation — accuracy vs leakage vs client cost (H1, headline)
dataset: cicids2017-improved
label_schema: family9
split: random          # plus temporal, run separately
subsample:
  rare_floor: 5000
  class_cap: 60000
model:
  hidden_layers: 4
  hidden_width: 128
  dropout: 0.2
training:
  scheme: split_sequential
  clients: 4
  dirichlet_alpha: 1.0
sweep:
  cut_depth: [1, 2, 3]
seeds: [0, 1, 2, 3, 4]
attacks: [activation_inference]
